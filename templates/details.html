<!DOCTYPE html>
<html>
<head>

    <title>{{ project.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img src="/{{ project.image }}"
                 width="100%"
                 class="rounded shadow">

        </div>

        <div class="col-md-6">

            <h1>{{ project.title }}</h1>

            <h5 class="text-primary mt-3">
                {{ project.category }}
            </h5>

            <p class="mt-4">
                {{ project.description }}
            </p>

            <h5>
                Tech Stack:
                {{ project.tech_stack }}
            </h5>

            <h3 class="text-success mt-3">
                ₹ {{ project.price }}
            </h3>

            <a href="https://wa.me/917550396326?text=Hi,%20I%20want%20to%20buy%20{{ project.title }}"
               class="btn btn-success mt-4">
               Buy on WhatsApp
            </a>

        </div>

    </div>

</div>

</body>
</html>
