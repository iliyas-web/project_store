<!DOCTYPE html>
<html>
<head>

    <title>Project Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Final Year Project Store
    </h1>

    <!-- SEARCH -->

    <form method="GET" action="/">

        <div class="row mb-5">

            <div class="col-md-5">

                <input type="text"
                       name="search"
                       class="form-control"
                       placeholder="Search Projects...">

            </div>

            <!-- CATEGORY FILTER -->

            <div class="col-md-3">

                <select name="category"
                        class="form-control">

                    <option>All</option>
                    <option>AI/ML</option>
                    <option>Python</option>
                    <option>.NET</option>
                    <option>Cyber Security</option>
                    <option>Unity</option>
                    <option>Web Development</option>

                </select>

            </div>

            <div class="col-md-2">

                <button class="btn btn-dark w-100">
                    Search
                </button>

            </div>

        </div>

    </form>

    <!-- PROJECTS -->

    <div class="row">

        {% for project in projects %}

        <div class="col-md-4">

            <div class="card shadow mb-4">

                <img src="/{{ project.image }}"
                     class="card-img-top"
                     height="220">

                <div class="card-body">

                    <h4>{{ project.title }}</h4>

                    <p class="text-primary">
                        {{ project.category }}
                    </p>

                    <p>{{ project.tech_stack }}</p>

                    <h5 class="text-success">
                        ₹ {{ project.price }}
                    </h5>

                    <a href="/project/{{ project.id }}"
                       class="btn btn-primary">
                       View Details
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
